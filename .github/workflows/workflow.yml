name: CI workflow

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: python:3.9-slim
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Initialize containers
        run: echo "Container job initialized"

      - name: Lint with flake8
        run: |
          pip install flake8 nose
          flake8 service --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 service --count --max-complexity=10 --max-line-length=127 --statistics

      - name: Run unit tests with nose
        run: nosetests -v --with-spec --spec-color --with-coverage --cover-package=app

      - name: Build and validate application
        run: |
          test -f Dockerfile
          echo "Build configuration found"

      - name: Post Checkout
        if: always()
        run: echo "Post Checkout"

      - name: Post Setup Node.js
        if: always()
        run: echo "Post Setup Node.js"

      - name: Complete job
        if: always()
        run: echo "Complete job"
